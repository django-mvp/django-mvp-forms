<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Tom Select widgets</title>
  </head>
  <body>
    <form id="page" method="post" action="">
      {% if refused %}<select id="id_refused" name="refused" data-tom-select='{"plugins": ["nowhere"]}'><option value="x">X</option></select>{% endif %}
      {{ form.as_div }}
      {% if foreign %}{{ foreign.as_div }}{% endif %}
      <button type="submit">Send</button>
    </form>
    {% for copy in copies %}{{ form.media }}{% endfor %}
    {% if tomselect_url %}<script src="{{ tomselect_url }}"></script>{% endif %}
  </body>
</html>
