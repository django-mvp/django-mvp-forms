{% load crispy_forms_tags %}<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Characters left</title>
    <script src="{{ htmx_url }}"></script>
  </head>
  <body>
    <form id="page" method="post" action="">
      {% crispy form %}
      {% crispy dialog %}
      <div id="rows"></div>
      <div id="swap"></div>
      <button id="send" type="submit">Send</button>
      <button id="load" type="button" hx-get="{% url 'characters-left-fragment' %}" hx-target="#swap">Load</button>
    </form>
    <template id="line">{{ line.as_div }}</template>
    {% if script %}{% for copy in copies %}{{ form.media }}{% endfor %}{% endif %}
  </body>
</html>
