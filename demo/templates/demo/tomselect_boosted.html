{% extends "page_view.html" %}
{% load crispy_forms_tags %}
{% block page.content %}
  <c-mvp.section title="Reached by htmx" icon="tomselect">
    <c-mvp.text>
      htmx swapped this page in without a full page load. The controls below started up
      when it arrived.
    </c-mvp.text>
    {% crispy form %}
  </c-mvp.section>
  <c-mvp.text>
    <a class="link" href="{% url 'tomselect' %}" hx-boost="true" hx-target="body">Back to the django-tomselect page</a>
  </c-mvp.text>
{% endblock page.content %}
