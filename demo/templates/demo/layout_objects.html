{% extends "page_view.html" %}
{% load crispy_forms_tags %}
{% block page.content %}
  <c-section title="Try it" icon="layout-objects">
    <c-text>
      Every field is required here. Submit the form empty to see an error on a
      field inside a fieldset, a row and a column.
    </c-text>
    <form method="post" novalidate>
      {% csrf_token %}
      {% crispy form %}
      <c-button type="submit" variant="primary" text="Submit" />
    </form>
  </c-section>
  <c-section title="Errors inside the containers" level="3">
    {% crispy failing_form %}
  </c-section>
  <c-text>
    <c-link href="{% url 'layout-objects-standalone' %}" text="The same page without django-mvp" />
  </c-text>
{% endblock page.content %}
