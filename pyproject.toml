[project]
name = "django-mvp-forms"
description = "A daisyUI template pack for django-crispy-forms, with form fields and widgets for django-mvp projects"
# Pre-viable. The first published release is 0.1.0, cut once the Essential
# goals in GOALS.md are delivered; until then the version stays in 0.0.x and
# nothing is uploaded to the package index.
version = "0.2.0"
authors = [
    { name = "Samuel Jennings", email = "samuel.scott.jennings@gmail.com" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<4.0"
# django-mvp is deliberately absent: it depends on this package for its form
# rendering, so a dependency in this direction would be a cycle. The demo
# project runs on django-mvp's shell and gets it from the dev group below.
dependencies = ["django>=5.2", "django-crispy-forms>=2.7"]
keywords = ["django", "django-mvp", "django-crispy-forms", "daisyui", "forms"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

[project.urls]
Homepage = "https://github.com/django-mvp/django-mvp-forms"
Repository = "https://github.com/django-mvp/django-mvp-forms"
Issues = "https://github.com/django-mvp/django-mvp-forms/issues"

[tool.hatch.build.targets.wheel]
# The demo project is deliberately absent: it is a place to look at this
# package while it is being written, not something a consuming project should
# receive.
packages = ["mvp_forms"]

# Hatchling's default source distribution is the whole working tree: tests, the
# demonstration project, documentation and CI configuration. Listing what ships
# keeps it to the package, the readme and the licence. Hatchling adds
# .gitignore itself, so that a build from the source distribution leaves out
# what the repository does. The leading slashes anchor each entry to the
# repository root, so `/README.md` does not also match `tests/README.md`.
[tool.hatch.build.targets.sdist]
include = ["/mvp_forms", "/README.md", "/LICENSE"]

[dependency-groups]
# Shared toolchain bundle, pinned to a release tag so every package built this
# way runs one version of each tool. Ships ruff, mypy, deptry, pre-commit,
# pytest, pytest-django, pytest-xdist, factory-boy, coverage and django-stubs.
dev = [
    "mvp-shared[dev,test]",
    # The demo project's application shell. Not a runtime dependency: see the
    # note on `dependencies` above.
    "django-mvp>=0.24.0",
]

[tool.uv.sources]
mvp-shared = { git = "https://github.com/django-mvp/shared.git", tag = "v0.6.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = [".", "tests"]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "-ra",
]

[tool.coverage.report]
skip_empty = true
show_missing = true

[tool.coverage.run]
branch = true
source = ["mvp_forms"]

[tool.djlint]
profile = "django"
indent = 2
preserve_leading_space = true
preserve_blank_lines = true
format_attribute_template_tags = true
format_css = true
format_js = true
max_line_length = 120
max_attribute_length = 70
include = "H006,H013,H020,H021,H023,H025,H030,H031"
ignore = "H017"
extension = "html"

# Lint and format are both ruff's: it replaces black (formatting), isort (the I
# rules) and pyupgrade (the UP rules), so those three do not appear here. The
# shared rule set lives in ruff-base.toml, copied in rather than referenced
# remotely — `extend` only accepts a local path.
[tool.ruff]
extend = "ruff-base.toml"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "B017", "A001", "RUF059"]
# The demo project is a demonstration target, never deployed: its settings
# carry a literal SECRET_KEY on purpose.
"demo/*" = ["S101", "S105", "S106"]

[tool.mypy]
files = ["mvp_forms"]
disallow_untyped_defs = "False"
disallow_any_unimported = "False"
ignore_missing_imports = "True"
no_implicit_optional = "True"
check_untyped_defs = "False"
warn_return_any = "True"
warn_unused_ignores = "True"
show_error_codes = "True"
exclude = ["docs/", "migrations/", "tests/settings.py"]
mypy_path = "mvp_forms/"
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "tests.settings"
ignore_missing_model_attributes = "True"

[tool.deptry]
extend_exclude = ["tests/", "demo/", "docs/"]

[tool.deptry.per_rule_ignores]
# django-crispy-forms is a real runtime dependency that no Python module here
# imports yet. The dependency is at the template level: the pack's templates
# are loaded by crispy-forms' template tags and render nothing without it.
DEP002 = ["django-crispy-forms"]

[tool.forge.conformance]
# None has a module under mvp_forms/ to mirror: the first covers the app
# registry, the second the undistributed demo project, the third the pack's
# templates.
non-mirror-paths = [
  "tests/test_smoke.py",
  "tests/test_demo.py",
  "tests/test_pack/",
  "tests/test_legibility/",
]
