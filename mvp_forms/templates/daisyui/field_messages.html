{% if field.help_text %}
  <p{% if field.auto_id %} id="{{ field.auto_id }}_helptext"{% endif %} class="label text-base-content">{{ field.help_text }}</p>
{% endif %}
{% if field.errors and form_show_errors != False %}
  <div{% if field.auto_id %} id="{{ field.auto_id }}_error"{% endif %}>
    {% for error in field.errors %}<p>{{ error }}</p>{% endfor %}
  </div>
{% endif %}
