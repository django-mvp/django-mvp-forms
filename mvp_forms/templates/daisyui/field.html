{% load daisyui %}
{% if field.is_hidden %}
  {{ field }}
{% else %}
  <div{% if field.auto_id %} id="div_{{ field.auto_id }}"{% endif %} class="fieldset">
    <label{% if field.id_for_label %} for="{{ field.id_for_label }}"{% endif %}>{{ field.label }}</label>
    {% daisyui_input field %}
    {% if field.help_text %}
      <p{% if field.auto_id %} id="{{ field.auto_id }}_helptext"{% endif %} class="label">{{ field.help_text }}</p>
    {% endif %}
    {% if field.errors %}
      <div{% if field.auto_id %} id="{{ field.auto_id }}_error"{% endif %} class="text-error">
        {% for error in field.errors %}<p>{{ error }}</p>{% endfor %}
      </div>
    {% endif %}
  </div>
{% endif %}
