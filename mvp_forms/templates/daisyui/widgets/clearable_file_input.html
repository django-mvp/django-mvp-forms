{% load daisyui %}<div class="flex flex-col gap-2">
  {% if widget.is_initial %}
    <p>{{ widget.initial_text }}: <a class="link" href="{{ widget.value.url }}">{{ widget.value }}</a></p>
    {% if not widget.required %}
      <label class="label" for="{{ widget.checkbox_id }}">
        <input type="checkbox" class="{{ widget.attrs.class|daisyui_removal_checkbox }}" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}"{% if widget.attrs.disabled %} disabled{% endif %}{% if widget.attrs.checked %} checked{% endif %}>
        {{ widget.clear_checkbox_label }}
      </label>
    {% endif %}
    <span>{{ widget.input_text }}:</span>
  {% endif %}
  <input type="{{ widget.type }}" name="{{ widget.name }}"{% include "daisyui/widgets/attrs.html" %}>
</div>
