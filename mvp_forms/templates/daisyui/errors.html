{% with errors=form.get_context.errors %}
  {% if errors %}
    <div role="alert" class="alert alert-error alert-soft text-base-content">
      <div>
        {% if form_error_title %}<p>{{ form_error_title }}</p>{% endif %}
        {% for error in errors %}<p>{{ error }}</p>{% endfor %}
      </div>
    </div>
  {% endif %}
{% endwith %}
