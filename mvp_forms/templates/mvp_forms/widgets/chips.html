<div{% if widget.attrs.id %} id="{{ widget.attrs.id }}"{% endif %} class="flex flex-col items-start gap-2">
  <div class="flex flex-wrap gap-2" data-choice-shown>
    {% for option in widget.shown %}
      <input type="{{ option.type }}" name="{{ option.name }}" value="{{ option.value|stringformat:'s' }}" data-choice-index="{{ option.position }}"{% include "daisyui/widgets/attrs.html" with widget=option %}>
    {% endfor %}
  </div>
  {% if widget.folded %}
    <details class="group w-full" data-choice-fold{% if widget.fold_open %} open{% endif %}>
      <summary class="link inline-flex min-h-11 cursor-pointer items-center gap-2">
        <span class="inline-grid size-5 place-items-center rounded-full border border-current leading-none" aria-hidden="true"><span class="group-open:hidden">+</span><span class="hidden group-open:inline">&minus;</span></span>
        <span>{{ widget.fold_label }}</span>
        {% if widget.fold_custom %}<span data-choice-count>{{ widget.fold_count }}</span>{% endif %}
      </summary>
      <div class="flex flex-wrap gap-2 pt-1">
        {% for option in widget.folded %}
          <input type="{{ option.type }}" name="{{ option.name }}" value="{{ option.value|stringformat:'s' }}" data-choice-index="{{ option.position }}"{% include "daisyui/widgets/attrs.html" with widget=option %}>
        {% endfor %}
      </div>
    </details>
  {% endif %}
  {% with option=widget.clearing %}
    {% if option %}
      <input type="{{ option.type }}" name="{{ option.name }}" value="{{ option.value|stringformat:'s' }}"{% include "daisyui/widgets/attrs.html" with widget=option %}>
    {% endif %}
  {% endwith %}
</div>
