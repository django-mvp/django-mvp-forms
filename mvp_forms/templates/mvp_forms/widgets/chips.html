<div{% if widget.attrs.id %} id="{{ widget.attrs.id }}"{% endif %} class="flex flex-col items-start gap-2">
  <div class="flex flex-wrap gap-2" data-choice-row>
    {% for option in widget.options %}
      <input type="{{ option.type }}" name="{{ option.name }}" value="{{ option.value|stringformat:'s' }}"{% if option.folded %} data-choice-folded{% endif %}{% include "daisyui/widgets/attrs.html" with widget=option %}>
    {% endfor %}
    {% if widget.folded %}
      <button type="button" hidden data-choice-more class="btn rounded-3xl h-auto min-h-12 whitespace-normal"><span aria-hidden="true">+</span> {{ widget.fold_label }}</button>
    {% endif %}
  </div>
  {% with option=widget.clearing %}
    {% if option %}
      <input type="{{ option.type }}" name="{{ option.name }}" value="{{ option.value|stringformat:'s' }}"{% include "daisyui/widgets/attrs.html" with widget=option %}>
    {% endif %}
  {% endwith %}
</div>
