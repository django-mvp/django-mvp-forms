<div{% if widget.attrs.id %} id="{{ widget.attrs.id }}"{% endif %} class="flex flex-wrap gap-2">
  {% for option in widget.options %}
    <input type="{{ option.type }}" name="{{ option.name }}" value="{{ option.value|stringformat:'s' }}"{% include "daisyui/widgets/attrs.html" with widget=option %}>
  {% endfor %}
  {% with option=widget.clearing %}
    {% if option %}
      <input type="{{ option.type }}" name="{{ option.name }}" value="{{ option.value|stringformat:'s' }}"{% include "daisyui/widgets/attrs.html" with widget=option %}>
    {% endif %}
  {% endwith %}
</div>
