{% load i18n %}
<div class="flex gap-3 {% if widget.horizontal %}flex-row flex-wrap {% if widget.align == "top" %}items-start{% elif widget.align == "bottom" %}items-end{% else %}items-center{% endif %}{% else %}flex-col items-start{% endif %}" data-image-input{% if widget.is_initial %} data-image-input-stored="{{ widget.value.url }}"{% endif %}{% if not widget.show_input %} data-image-input-picker{% endif %}>
  {% if widget.show_input %}<div class="avatar avatar-placeholder max-w-full shrink-0">{% else %}<button type="button" class="avatar avatar-placeholder group max-w-full shrink-0 cursor-pointer rounded-box" aria-label="{{ widget.label }}: {% if widget.is_initial %}{% translate 'Change image' %}{% else %}{% translate 'Add image' %}{% endif %}" data-change="{{ widget.label }}: {% translate 'Change image' %}" data-add="{{ widget.label }}: {% translate 'Add image' %}"{% if widget.attrs.disabled %} disabled{% endif %} hidden data-image-input-open>{% endif %}
    <div class="relative bg-base-200 transition-opacity {% if widget.mask %}mask {{ widget.mask_class }}{% else %}rounded-box border {% if widget.invalid and not widget.show_input %}border-error{% else %}border-base-300{% endif %}{% if not widget.show_input %} hover:border-primary{% endif %}{% endif %}" style="height: calc({{ widget.height|stringformat:'s' }} * 1rem); aspect-ratio: calc({{ widget.ratio|stringformat:'s' }})" data-image-input-frame>
      <img class="{% if widget.aspect_ratio %}object-cover{% else %}h-auto max-h-full w-auto max-w-full object-contain{% endif %}" alt="{{ widget.label }}"{% if widget.is_initial %} src="{{ widget.value.url }}"{% else %} hidden{% endif %} data-image-input-preview>
      <div class="flex flex-col items-center gap-1 px-2 text-center text-xs text-base-content"{% if widget.is_initial %} hidden{% endif %} data-image-input-empty>
        <svg class="size-8" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Zm10.5-11.25h.008v.008h-.008V8.25Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z"/></svg>
        <span data-image-input-empty-text data-empty="{% if widget.show_input %}{% translate 'No image' %}{% else %}{% translate 'Add image' %}{% endif %}" data-missing="{% translate 'Image not found' %}" data-unreadable="{% translate 'No preview' %}">{% if widget.show_input %}{% translate "No image" %}{% else %}{% translate "Add image" %}{% endif %}</span>
      </div>
      {% if not widget.show_input %}
        <span class="absolute inset-x-0 bottom-0 bg-neutral py-1 text-center text-xs text-neutral-content opacity-0 transition-opacity group-hover:opacity-100 group-focus-within:opacity-100"{% if not widget.is_initial %} hidden{% endif %} aria-hidden="true" data-image-input-hint>{% translate "Change image" %}</span>
      {% endif %}
    </div>
  {% if widget.show_input %}</div>{% else %}</button>{% endif %}
  <div class="flex flex-col gap-2 {% if widget.horizontal %}min-w-52 flex-1{% else %}w-full{% endif %}">
    {% if widget.is_initial and widget.show_file_name %}
      <p class="text-sm text-base-content break-words">{{ widget.initial_text }}: <a class="link" href="{{ widget.value.url }}" target="_blank" rel="noopener">{{ widget.file_name }}</a></p>
    {% endif %}
    <div data-image-input-field><input type="{{ widget.type }}" name="{{ widget.name }}"{% include "daisyui/widgets/attrs.html" %}></div>
    <div class="flex flex-wrap items-center gap-x-4 gap-y-1"{% if not widget.is_initial or widget.required %} hidden{% endif %} data-image-input-actions>
      {% if widget.is_initial and not widget.required %}
        <label class="label text-base-content text-wrap w-fit" for="{{ widget.checkbox_id }}">
          <input type="checkbox" class="checkbox{% if widget.removal_class %} {{ widget.removal_class }}{% endif %}" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}"{% if widget.attrs.disabled %} disabled{% endif %}{% if widget.attrs.checked %} checked{% endif %} data-image-input-remove>
          {{ widget.clear_checkbox_label }}
        </label>
      {% endif %}
      <button type="button" class="link link-primary text-sm" hidden data-image-input-revert>{% translate "Revert changes" %}</button>
    </div>
    <p class="text-sm text-base-content" aria-live="polite" hidden data-image-input-status
       data-pending="{% translate 'You must save this form for changes to take effect.' %}"
       data-unreadable="{% translate 'This file cannot be shown as an image.' %}"></p>
  </div>
</div>
