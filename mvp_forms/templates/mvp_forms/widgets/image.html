{% load i18n %}
<div class="flex flex-col gap-3 sm:flex-row sm:items-start" data-image-input{% if widget.is_initial %} data-image-input-stored="{{ widget.value.url }}"{% endif %}>
  <div class="avatar avatar-placeholder shrink-0">
    <div class="w-24 rounded-box border border-base-300 bg-base-200 transition-opacity" data-image-input-frame>
      <img class="h-auto max-h-full w-auto max-w-full object-contain" alt="{{ widget.label }}"{% if widget.is_initial %} src="{{ widget.value.url }}"{% else %} hidden{% endif %} data-image-input-preview>
      <div class="flex flex-col items-center gap-1 px-2 text-center text-xs text-base-content"{% if widget.is_initial %} hidden{% endif %} data-image-input-empty>
        <svg class="size-8" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Zm10.5-11.25h.008v.008h-.008V8.25Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z"/></svg>
        <span data-image-input-empty-text data-empty="{% translate 'No image' %}" data-missing="{% translate 'Image not found' %}" data-unreadable="{% translate 'No preview' %}">{% translate "No image" %}</span>
      </div>
    </div>
  </div>
  <div class="flex min-w-0 flex-1 flex-col gap-2">
    {% if widget.is_initial %}
      <p class="text-sm text-base-content break-words">{{ widget.initial_text }}: <a class="link" href="{{ widget.value.url }}" target="_blank" rel="noopener">{{ widget.file_name }}</a></p>
    {% endif %}
    <input type="{{ widget.type }}" name="{{ widget.name }}"{% include "daisyui/widgets/attrs.html" %}>
    {% if widget.is_initial and not widget.required %}
      <label class="label text-base-content text-wrap w-fit" for="{{ widget.checkbox_id }}">
        <input type="checkbox" class="checkbox{% if widget.removal_class %} {{ widget.removal_class }}{% endif %}" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}"{% if widget.attrs.disabled %} disabled{% endif %}{% if widget.attrs.checked %} checked{% endif %} data-image-input-remove>
        {{ widget.clear_checkbox_label }}
      </label>
    {% endif %}
    <p class="flex flex-wrap items-center gap-x-2 text-sm" aria-live="polite" hidden data-image-input-status
       data-chosen="{% if widget.is_initial %}{% translate 'The new image replaces the current one when the form is sent.' %}{% else %}{% translate 'The image is added when the form is sent.' %}{% endif %}"
       data-removed="{% translate 'The current image is removed when the form is sent.' %}"
       data-unreadable="{% translate 'This file cannot be shown as an image.' %}">
      <span data-image-input-status-text></span>
      <button type="button" class="link link-primary" hidden data-image-input-undo>{% translate "Undo" %}</button>
    </p>
  </div>
</div>
