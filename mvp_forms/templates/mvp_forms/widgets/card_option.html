<label class="card card-border group cursor-pointer flex-row items-center gap-3 p-3 {{ widget.choice_class }} has-focus-visible:outline" data-choice-index="{{ option.position }}">
  {% if option.icon %}
    <div class="grid size-9 shrink-0 place-items-center rounded-field bg-base-200 group-has-checked:bg-primary group-has-checked:text-primary-content">{{ option.icon }}</div>
  {% endif %}
  <div class="min-w-0 grow">
    {% if option.meta %}<div class="text-xs font-medium uppercase tracking-wide text-base-content/90">{{ option.meta }}</div>{% endif %}
    <div class="font-semibold">{{ option.label }}</div>
    {% if option.description %}<div class="text-sm text-base-content/90">{{ option.description }}</div>{% endif %}
  </div>
  <input type="{{ option.type }}" name="{{ option.name }}" value="{{ option.value|stringformat:'s' }}"{% include "daisyui/widgets/attrs.html" with widget=option %}>
</label>
